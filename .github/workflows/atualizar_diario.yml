name: Atualizar Dashboard Binance Diario

on:
  schedule:
    # 00:05 UTC equivale às 21:05 no horário de Brasília (UTC-3)
    - cron: '5 0 * * *'
  workflow_dispatch: # Permite disparar manualmente através do botão 'Run workflow'

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Autorização explícita para salvar ficheiros no repositório

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v3

      - name: Configurar o Python
        uses: actions/setup-python@v4

      - name: Instalar bibliotecas necessárias
        run: pip install requests pandas

      - name: Executar script de coleta da Binance
        run: python processar_dados.py

      - name: Salvar o dados.json atualizado no repositório
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dados.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualizacao automatica do dados.json [skip ci]" && git push)
