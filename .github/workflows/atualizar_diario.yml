name: Atualizar Dashboard Binance Diario

on:
  schedule:
    # 00:05 UTC equivale exatamente às 21:05 no horário de Brasília (UTC-3)
    - cron: '5 0 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas necessárias
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Executar script de coleta da Binance
        run: python processar_dados.py

      - name: Gravar dados.json no repositório
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dados.json
          if ! git diff --staged --quiet; then
            git commit -m "Atualizacao automatica do dados.json"
            git push origin main
            echo "dados.json atualizado e enviado com sucesso!"
          else
            echo "dados.json ja se encontra atualizado."
          fi
