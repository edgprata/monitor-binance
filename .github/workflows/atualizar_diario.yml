name: Atualizar Dashboard Binance Diario

on:
  schedule:
    # 00:02 UTC equivale às 21:02 no horário de Brasília (UTC-3)
    - cron: '2 0 * * *'
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas necessárias
        run: pip install requests pandas

      - name: Executar script de coleta da Binance
        run: python processar_dados.py

      - name: Forçar atualização do dados.json no repositório
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f dados.json
          git commit -m "Atualizacao automatica do dados.json para 21/10 [skip ci]" || echo "Arquivo sem alteracoes"
          git push origin main
